name: Release toolbox

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: toolbox-release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      export-image: true
    permissions:
      contents: read
      pull-requests: write

  release-please:
    needs: validate
    if: ${{ needs.validate.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Check trusted branch before creating a release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = process.env.SOURCE_SHA;
            const branch = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (branch.data.commit.sha !== sha) throw new Error('main advanced; do not release an older run');
            const prs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit,
              { owner, repo, commit_sha: sha, per_page: 100 });
            if (!prs.some(pr => pr.merged_at && pr.base.ref === 'main' && pr.merge_commit_sha === sha)) {
              throw new Error('Only a merged main PR can release; direct pushes cannot publish');
            }
      - name: Require CI-capable release PR credentials
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "::error::Configure RELEASE_PLEASE_TOKEN in the release environment so release PRs trigger validation"
            exit 1
          fi
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: [validate, release-please]
    if: ${{ needs.validate.result == 'success' && needs.release-please.outputs.release-created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.sha }}
      RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
      RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
      EXPECTED_IMAGE_ID: ${{ needs.validate.outputs.image-id }}
    steps:
      - name: Verify the release identifies the validated commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = process.env.SOURCE_SHA;
            const tag = process.env.RELEASE_TAG;
            if (process.env.RELEASE_SHA !== sha) throw new Error('Release does not match the validated commit');
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Expected a stable semantic version tag');
            const branch = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (branch.data.commit.sha !== sha) throw new Error('main advanced; do not publish an older run');
            const ref = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            if (ref.data.object.sha !== sha) throw new Error('Release tag does not match the validated commit');
            const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            if (release.data.draft || release.data.prerelease) throw new Error('Expected a published stable release');
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-image
      - name: Publish the validated bytes, never rebuild
        run: |
          set -euo pipefail
          [[ "$EXPECTED_IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gzip -dc validated-image.tar.gz | docker load
          test "$(docker image inspect azure-iac-toolbox:ci --format '{{.Id}}')" = "$EXPECTED_IMAGE_ID"
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image=$(printf 'ghcr.io/%s' "$GH_REPO" | tr '[:upper:]' '[:lower:]')
          for tag in "sha-$SOURCE_SHA" "$RELEASE_TAG"; do
            if docker manifest inspect "$image:$tag" > existing.json 2> manifest-error.txt; then
              test "$(jq -r '.config.digest' existing.json)" = "$EXPECTED_IMAGE_ID"
            else
              # Only a genuinely missing manifest permits a new immutable tag.
              grep -Eqi 'manifest unknown|no such manifest' manifest-error.txt
              docker tag azure-iac-toolbox:ci "$image:$tag"
              docker push "$image:$tag"
            fi
          done
      - name: Report published image and scan policy
        run: |
          {
            echo "Published ghcr.io/${GH_REPO,,}:$RELEASE_TAG from $SOURCE_SHA"
            echo "Image config: $EXPECTED_IMAGE_ID"
            echo "Vulnerability findings are informational and do not block this release; review the image-scan artifact."
          } >> "$GITHUB_STEP_SUMMARY"
