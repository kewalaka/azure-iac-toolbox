name: Validate

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      export-image:
        type: boolean
        default: false
    outputs:
      image-id:
        value: ${{ jobs.image.outputs.image-id }}

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      image-required: ${{ steps.paths.outputs.image-required }}
    steps:
      - name: Decide whether PR changes require an image
        id: paths
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('image-required', 'true');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: context.issue.number, per_page: 100
            });
            if (files.length !== context.payload.pull_request.changed_files || files.length >= 3000) {
              throw new Error('Incomplete PR file list; cannot safely skip image validation');
            }
            const inputs = new Set([
              'Dockerfile', '.dockerignore', '.tflint.hcl',
              'scripts/install-tools.sh', 'scripts/toolbox-check.sh',
              'scripts/toolbox-entrypoint.sh'
            ]);
            core.setOutput('image-required', String(files.some(file =>
              inputs.has(file.filename) || inputs.has(file.previous_filename))));
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check shell scripts
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          shellcheck scripts/*.sh
      - name: Test toolbox and update/release gates
        run: python3 -B -m unittest discover -s tests -v
      - name: Validate the locked agentic workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          curl -fsSL --retry 3 https://github.com/github/gh-aw/releases/download/v0.93.2/linux-amd64 -o "$work/gh-aw"
          echo "364b98de9a8b8948792289128bbf3907d152284804e02b70804fc123e09ca6fd  $work/gh-aw" | sha256sum --check
          chmod +x "$work/gh-aw"
          "$work/gh-aw" compile --strict
          git diff --exit-code -- .github/workflows/package-updates.lock.yml .github/aw/actions-lock.json
      - name: Check Dockerfile
        env:
          HADOLINT_VERSION: 2.15.1
        run: |
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          base="https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}"
          curl -fsSL --retry 3 "$base/hadolint-linux-x86_64" -o "$work/hadolint-linux-x86_64"
          curl -fsSL --retry 3 "$base/checksums.sha256" -o "$work/checksums.sha256"
          (cd "$work" && awk '$2 == "hadolint-linux-x86_64" || $2 == "*hadolint-linux-x86_64"' checksums.sha256 | sha256sum --check -)
          chmod +x "$work/hadolint-linux-x86_64"
          "$work/hadolint-linux-x86_64" Dockerfile

  image:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      report-ready: ${{ steps.artifact.outcome == 'success' }}
      image-id: ${{ steps.export.outputs.image-id }}
    steps:
      - name: Report image validation not required
        if: ${{ needs.static.outputs.image-required == 'false' }}
        run: echo "Image validation skipped - this PR changes no image inputs. Static validation passed." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.static.outputs.image-required != 'false' }}
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: ${{ needs.static.outputs.image-required != 'false' }}
      - name: Build image without publishing
        id: build
        if: ${{ needs.static.outputs.image-required != 'false' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: azure-iac-toolbox:ci
      - name: Test tools and Docker Engine
        id: smoke
        if: ${{ needs.static.outputs.image-required != 'false' }}
        run: |
          docker run --rm azure-iac-toolbox:ci toolbox-check
          docker run --rm --privileged --volume /var/lib/docker -e TOOLBOX_DOCKER=1 azure-iac-toolbox:ci \
            bash -euc 'docker run --rm hello-world && printf "FROM hello-world\n" | docker buildx build --load -t toolbox-smoke -'
      - name: Scan OS and application dependencies
        id: scan
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: azure-iac-toolbox:ci
          scanners: vuln
          vuln-type: os,library
          format: json
          output: trivy-results.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          timeout: 15m
      - name: Write vulnerability summary and require a complete scan
        if: ${{ !cancelled() && needs.static.outputs.image-required != 'false' }}
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 -B scripts/report-image-scan.py
      - name: Retain scan report
        id: artifact
        if: ${{ !cancelled() && hashFiles('image-summary.md') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-scan
          path: |
            trivy-results.json
            image-summary.md
          retention-days: 14
          if-no-files-found: error
      - name: Export the exact tested and scanned image
        id: export
        if: ${{ success() && inputs.export-image && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          docker image inspect azure-iac-toolbox:ci --format '{{.Id}}' | sed 's/^/image-id=/' >> "$GITHUB_OUTPUT"
          docker save azure-iac-toolbox:ci | gzip > validated-image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ success() && steps.export.outcome == 'success' }}
        with:
          name: validated-image
          path: validated-image.tar.gz
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  pr-report:
    needs: image
    if: >-
      ${{ !cancelled() && needs.image.outputs.report-ready == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-scan
      - name: Update PR scan comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const body = fs.readFileSync('image-summary.md', 'utf8');
            if (body.length > 60000) throw new Error('Scan summary exceeds comment limit');
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number, per_page: 100
            });
            const previous = comments.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.startsWith('<!-- toolbox-image-scan -->'));
            if (previous) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: previous.id, body
              });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
